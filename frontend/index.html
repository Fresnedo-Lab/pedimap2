    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No CSP meta tag here by design.
         Tauri injects the CSP from src-tauri/tauri.conf.json
         (app.security.csp) into the production build. In dev the page is
         served by Vite, which sends no CSP header, so a meta tag here would
         be the ONLY policy in effect and would silently override the Tauri
         config. Edit the CSP in tauri.conf.json instead. -->
    <title>Pedimap 2</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
