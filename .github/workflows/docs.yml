# .github/workflows/docs.yml
# ============================
# Builds pedimap2-manual.pdf from docs/*.md and CHANGELOG.md via pandoc + xelatex.
#
# Triggers:
#   • push to main that touches docs/ or CHANGELOG.md → build, upload artifact
#   • workflow_call from release.yml                 → same build; the release
#     workflow's publish job downloads the artifact and attaches it to the
#     release as Pedimap2-VERSION-User-Manual.pdf
#
# This workflow never touches GitHub Releases itself. It used to run on version
# tags and attach the PDF with softprops/action-gh-release, which creates a
# PUBLISHED release when none exists yet. That raced the draft created by
# release.yml and let files be appended to an existing release.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
  workflow_call:

permissions:
  contents: read

jobs:
  build-pdf:
    name: Build PDF manual
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # ── Install pandoc and XeLaTeX ─────────────────────────────────────────
      - name: Install pandoc and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-extra

      # ── Build PDF ──────────────────────────────────────────────────────────
      # Chapters are concatenated in order; README.md is used as the title page.
      - name: Build pedimap2-manual.pdf
        run: |
          pandoc \
            docs/README.md \
            docs/01_introduction.md \
            docs/02_installation.md \
            docs/03_quickstart.md \
            docs/04_file_formats.md \
            docs/05_interface.md \
            docs/06_visualization.md \
            docs/07_data_export.md \
            docs/08_advanced.md \
            docs/09_faq.md \
            CHANGELOG.md \
            --pdf-engine=xelatex \
            --toc \
            --toc-depth=2 \
            -V title="Pedimap 2 User Manual" \
            -V author="Fresnedo-Lab" \
            -V geometry:margin=2.5cm \
            -V fontsize=11pt \
            -V mainfont="DejaVu Serif" \
            -V sansfont="DejaVu Sans" \
            -V monofont="DejaVu Sans Mono" \
            -o pedimap2-manual.pdf

      # ── Upload artifact (every run) ────────────────────────────────────────
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pedimap2-manual
          path: pedimap2-manual.pdf
          retention-days: 30

